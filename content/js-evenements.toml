  "Utiliser l'attribut onclick dans le HTML : ça mélange structure et comportement, et une seule fonction possible — addEventListener partout.",
  "Poser un listener par élément dans une liste de 200 items : un seul listener délégué sur le parent fait mieux le travail."
]
exercises = [
