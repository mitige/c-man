  "Additionner des enums comme des int sans réfléchir : PLAYING + 1 compile, mais ne veut peut-être rien dire.",
  "Croire qu'un enum restreint les valeurs : on peut caster n'importe quel int dedans, rien n'est vérifié à l'exécution."
]
