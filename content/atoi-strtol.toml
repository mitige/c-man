  "Oublier errno = 0 avant strtol : personne ne remet errno a zero a ta place, tu peux relire un vieux ERANGE.",
  "Tester endptr == NULL au lieu de *endptr == '\\0' : strtol ecrit dans *endptr, le pointeur lui-meme ne change pas.",
  "Croire que atoi gere plusieurs signes : \"--42\" renvoie 0 (le deuxieme signe n'est pas un chiffre)."
]
