  "Confondre p et *p : p est l'adresse, *p est la valeur — printf(\"%d\", p) au lieu de *p affiche une adresse tronquée.",
  "Croire que int *p, q; déclare deux pointeurs : q est un int ! Écris int *p, *q; ou mieux, une déclaration par ligne.",
  "Oublier que les arguments sont copiés : une fonction ne peut pas modifier ta variable sans recevoir son adresse."
]
