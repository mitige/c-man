  "Mettre z-index sur un élément static : sans effet, il faut une position non-static.",
  "Oublier que fixed et absolute sortent du flux : le contenu suivant passe dessous, compense avec du padding.",
  "Un sticky sans seuil (top, left...) ou dont le parent est trop petit ne colle jamais."
]
exercises = [
