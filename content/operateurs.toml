  "Avec des operandes negatifs, le resultat de % prend le signe du numerateur : -7 % 2 == -1 en C99.",
  "Dans une expression, i++ renvoie l'ancienne valeur et ++i la nouvelle : lis le code a voix haute pour verifier.",
  "Les priorites peuvent trahir : !x == 0 se lit (!x) == 0, pas !(x == 0). Parenthese des le moindre doute."
]
