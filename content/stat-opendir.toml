  "Oublier le define _POSIX_C_SOURCE 200809L avec -std=c99 : implicit declaration of lstat ou opendir, et -Werror te refuse la compile.",
  "Oublier closedir : chaque DIR * tient un descripteur de fichier, la fuite finit par taper la limite de descripteurs du processus.",
  "Se fier a d_type : DT_UNKNOWN est une valeur legale sur certains systemes de fichiers, repasse par lstat pour le type."
]
exercises = [
  "Ecris my_ls qui liste le repertoire passe en argument, une entree par ligne, en filtrant \".\" et \"..\".",
  "Ajoute l'affichage du type (d, -, l) et de la taille via lstat, facon ls -l simplifie.",
  "Rends-le recursif : quand une entree est un S_ISDIR, descends dedans avec le chemin complet."
]
