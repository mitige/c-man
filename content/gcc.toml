synopsis = "gcc -Wall -Wextra -Werror -std=c99 main.c -o mon_prog"
description = '''
## En une phrase

`gcc` transforme ton code source C en programme exécutable : c'est LE traducteur entre tes idées et un binaire que la moulinette peut lancer.

## Les 4 étapes (à savoir réciter)

Quand tu tapes `gcc main.c`, quatre phases s'enchaînent :

1. **Préprocesseur** : remplace les `#include` et `#define`, découpe les commentaires. Voir le résultat : `gcc -E main.c`.
2. **Compilation** : traduit le C en assembleur (`gcc -S` produit un fichier `.s`).
3. **Assemblage** : transforme l'assembleur en fichier objet binaire `.o` (`gcc -c`).
4. **Édition de liens** : colle les `.o` et les bibliothèques ensemble pour produire l'exécutable.

Sans option, `gcc main.c` enchaîne les 4 et nomme le résultat `a.out` : moche, et jamais le nom attendu par le sujet.

## En pratique

```bash
gcc main.c                        # produit a.out (nom par défaut, à éviter)
gcc main.c -o my_prog             # produit my_prog : toujours -o en piscine
gcc -c main.c                     # produit main.o seulement, sans édition de liens
gcc main.c utils.c -o my_prog     # plusieurs .c compilés puis liés ensemble
```

Sur un projet à plusieurs fichiers, la méthode propre :

```bash
gcc -c main.c -o main.o
gcc -c utils.c -o utils.o
gcc main.o utils.o -o my_prog     # édition de liens finale
```

Avantage : si tu modifies seulement `utils.c`, tu ne recompiles que lui. C'est exactement ce que ton **Makefile** automatise pour toi.

> En piscine, tu ne taperas presque jamais gcc à la main : c'est `make` qui le lance. Mais le jour où make affiche "undefined reference", tu dois comprendre quelle commande gcc a échoué et pourquoi.

## À retenir

- Toujours `-o nom` : la moulinette cherche le binaire au nom exact du sujet, pas `a.out`.
- `-c` s'arrête avant l'édition de liens : aucun `main` n'est requis dans le fichier.
- Les erreurs gcc se lisent `fichier.c:ligne:colonne` : apprends ce format dès le premier jour.
- Compile toujours avec `-Wall -Wextra -Werror -std=c99` : voir la fiche flags de compilation.
'''
example = '''
# Transcript : du source au binaire, en étapes séparées
$ cat hello.c
#include <unistd.h>

void my_putchar(char c);

int main(void)
{
    my_putchar(72);    /* 'H' */
    my_putchar(105);   /* 'i' */
    my_putchar(10);    /* saut de ligne */
    return 0;
}
$ cat my_putchar.c
#include <unistd.h>

void my_putchar(char c)
{
    write(1, &c, 1);
}
# Compilation séparée (étapes 1-3) puis édition de liens (étape 4) :
$ gcc -Wall -Wextra -Werror -std=c99 -c hello.c -o hello.o
$ gcc -Wall -Wextra -Werror -std=c99 -c my_putchar.c -o my_putchar.o
$ gcc hello.o my_putchar.o -o hello
$ ./hello
Hi
# Raccourci équivalent en une seule commande :
$ gcc -Wall -Wextra -Werror -std=c99 hello.c my_putchar.c -o hello
'''
