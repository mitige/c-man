  "Le pipe ne transmet que stdout : les erreurs continuent d'aller à l'écran sauf si tu ajoutes 2>&1.",
  "cat fichier | grep motif est un processus de trop : grep motif fichier fait la même chose.",
  "Rediriger stderr de gcc vers /dev/null ne corrige rien : lis tes erreurs, elles sont ta carte au trésor."
]
exercises = [
