  "Confondre caractere et valeur : isdigit('0') est vrai, isdigit(0) est faux.",
  "Oublier qu'isspace couvre aussi '\\t', '\\n', '\\v', '\\f' et '\\r', pas seulement l'espace.",
  "Attendre une erreur de toupper sur un chiffre : il renvoie le caractere inchange, silencieusement."
]
