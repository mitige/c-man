  "Caster en int* au lieu d'octets dans my_memcpy : tu copierais 4 fois trop d'octets par tour de boucle.",
  "Utiliser memmove par habitude sans comprendre : c'est le SENS de copie (avant ou arriere) qui gere le recouvrement."
]
